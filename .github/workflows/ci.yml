name: public-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned official action commit, not a mutable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes
          javac -encoding UTF-8 -d build/classes src/main/java/org/example/life/LifeLoopDemo.java
          out="$(java -cp build/classes org.example.life.LifeLoopDemo)"
          echo "$out"
          echo "$out" | grep -qx 'DEMO_RESULT=PASS'
      - name: Public scope allowlist and manifest gate
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          diff <(git ls-files | sort) <(grep -vE '^#|^$' PUBLIC_SOURCE_ALLOWLIST.txt | sort)
          sha256sum -c SOURCE_MANIFEST.sha256
          ! git ls-files | grep -E '\.(apk|aab|db|sqlite|log|keystore|jks|p12)$'
          ! git grep -nE 'sk-[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- .
